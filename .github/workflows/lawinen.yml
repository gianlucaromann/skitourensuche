name: Lawinenbulletin aktualisieren
on:
  schedule:
    # SLF publiziert um 8 und 17 Uhr (Schweizer Zeit); kurz danach abholen
    - cron: "20 7 * * *"
    - cron: "20 8 * * *"
    - cron: "20 16 * * *"
    - cron: "20 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bulletin abrufen
        run: python3 tools/lawinen.py
      - name: Datei speichern
        run: |
          git config user.name "lawinenbulletin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lawinen.json
          git diff --cached --quiet || (git commit -m "Lawinenbulletin aktualisiert" && git push origin HEAD:main)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
